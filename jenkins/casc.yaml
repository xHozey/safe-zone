jenkins:
  systemMessage: "Buy-01 Jenkins controller configured with JCasC"
  numExecutors: 2
  mode: NORMAL
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID}"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: sonarqube-token
              secret: "${SONAR_TOKEN}"
              description: SonarQube analysis token
          - usernamePassword:
              scope: GLOBAL
              id: github-api
              username: "${GITHUB_USERNAME}"
              password: "${GITHUB_TOKEN}"
              description: GitHub API access for Jenkins

tool:
  nodejs:
    installations:
      - name: "NodeJS 22"
        properties:
          - installSource:
              installers:
                - nodeJSInstaller:
                    id: "22.16.0"
                    npmPackagesRefreshHours: 72

unclassified:
  sonarGlobalConfiguration:
    installations:
      - name: SonarQube
        serverUrl: http://sonarqube:9000
        credentialsId: sonarqube-token
  location:
    adminAddress: "${SMTP_FROM:-jenkins@localhost}"
  extendedEmailPublisher:
    defaultContentType: "text/plain"
    defaultRecipients: "${CI_EMAIL_TO:-}"
    mailAccount:
      smtpHost: "${SMTP_HOST:-}"
      smtpPort: "${SMTP_PORT:-587}"
      smtpUsername: "${SMTP_USERNAME:-}"
      smtpPassword: "${SMTP_PASSWORD:-}"
      useTls: ${SMTP_USE_TLS:-true}
      useSsl: ${SMTP_USE_SSL:-false}

jobs:
  - script: |
      multibranchPipelineJob('buy-01') {
        description('Buy-01 CI pipeline.')

        branchSources {
          branchSource {
            source {
              github {
                id('buy-01-github')
                credentialsId('github-api')
                repoOwner('xHozey')
                repository('safe-zone')
                repositoryUrl('https://github.com/xHozey/safe-zone')
                configuredByUrl(false)

                traits {

                  gitHubPullRequestDiscovery {
                    strategyId(1)
                  }
                }
              }
            }
          }
        }

        factory {
          workflowBranchProjectFactory {
            scriptPath('jenkins/Jenkinsfile')
          }
        }

        triggers {
          periodicFolderTrigger {
            interval('10s')
          }
        }

        orphanedItemStrategy {
          discardOldItems {
            daysToKeep(30)
            numToKeep(20)
          }
        }
      }
